<h1>Counter App</h1>

<div>
  <h2 class="count">{{count}}</h2>
  <div class="btns">
    <button class="btn dec" (click)="updateValue('dec')">Decreament</button>
    <button class="btn res" (click)="updateValue('res')">Reset</button>
    <button class="btn inc" (click)="updateValue('inc')">Increament</button>
  </div>
</div>
